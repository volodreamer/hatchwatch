name: Android APK

on:
  push:
    branches: [android]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/hatchwatch-debug.apk

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts | head -1)
          NOTES="Hatchwatch ${VER} debug APK. Same keystore as earlier overlays — install over the current app. The phone can open this .apk directly."
          TITLE="Hatchwatch Android ${VER}"
          if gh release view apk >/dev/null 2>&1; then
            gh release upload apk dist/hatchwatch-debug.apk --clobber
            gh release edit apk --title "$TITLE" --notes "$NOTES" --latest --target "${GITHUB_SHA}"
          else
            gh release create apk dist/hatchwatch-debug.apk --title "$TITLE" --notes "$NOTES" --latest --target "${GITHUB_SHA}"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hatchwatch-debug-apk
          path: dist/hatchwatch-debug.apk
          if-no-files-found: error
          retention-days: 30
