name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Pick Pages output
        run: |
          set -e
          mkdir -p _site
          if [ -d dist/client ]; then cp -a dist/client/. _site/
          elif [ -d dist/public ]; then cp -a dist/public/. _site/
          elif [ -d .output/public ]; then cp -a .output/public/. _site/
          else echo "Build output not found"; find dist .output -type f | head; exit 1
          fi
          if [ -f _site/_shell.html ]; then
            cp _site/_shell.html _site/index.html
            cp _site/_shell.html _site/404.html
          elif [ -f _site/index.html ]; then
            cp _site/index.html _site/404.html
          else echo "No HTML shell"; ls -la _site | head; exit 1
          fi
          touch _site/.nojekyll
          test -f _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
